[package]
name = "soufflerie"
description = "Soufflerie de poche, version native : interface graphique et ligne de commande"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gui", "gpu"]
gui = ["dep:eframe", "dep:egui_plot", "dep:rfd", "dep:png", "gpu"]
gpu = ["lbm/gpu"]

[dependencies]
lbm = { path = "../lbm", default-features = false }
rayon = "1"
eframe = { version = "0.37", optional = true, features = ["glow", "wgpu"] }
egui_plot = { version = "0.38", optional = true }
# Dialogue natif d'ouverture de fichier (maquettes STL).
rfd = { version = "0.15", optional = true }
# Export des images (vue 3D, captures de la fenêtre).
png = { version = "0.18", optional = true }
