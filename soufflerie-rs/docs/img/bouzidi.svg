<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Rebond interpolé de Bouzidi selon la fraction q du lien"><title>Rebond interpolé de Bouzidi selon la fraction q du lien</title><style>
.bg{fill:#fcfcfb}
.t{fill:#0b0b0b;font:14px system-ui,-apple-system,'Segoe UI',sans-serif}
.tb{fill:#0b0b0b;font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif}
.t2{fill:#52514e;font:12px system-ui,-apple-system,'Segoe UI',sans-serif}
.tm{fill:#52514e;font:italic 13px Georgia,'Times New Roman',serif}
.ln{stroke:#52514e;fill:none}
.lnf{fill:#52514e}
.mu{stroke:#898781;fill:none}
.grid{stroke:#e1e0d9;fill:none}
.body{fill:#dedcd5;stroke:#52514e}
.b{stroke:#2a78d6;fill:none}.bf{fill:#2a78d6}.bl{fill:#2a78d6;fill-opacity:.14}
.o{stroke:#eb6834;fill:none}.of{fill:#eb6834}.ol{fill:#eb6834;fill-opacity:.16}
.a{stroke:#1baf7a;fill:none}.af{fill:#1baf7a}.al{fill:#1baf7a;fill-opacity:.18}
.sf{fill:#fcfcfb}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19}.sf{fill:#1a1a19}
.t,.tb{fill:#f0efec}.t2,.tm{fill:#c3c2b7}
.ln{stroke:#c3c2b7}.lnf{fill:#c3c2b7}.grid{stroke:#2c2c2a}
.body{fill:#3f3e3b;stroke:#c3c2b7}
.b{stroke:#3987e5}.bf{fill:#3987e5}.bl{fill:#3987e5}
.o{stroke:#d95926}.of{fill:#d95926}.ol{fill:#d95926}
.a{stroke:#199e70}.af{fill:#199e70}.al{fill:#199e70}
}
</style><defs><marker id="mln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="lnf"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="bf"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="of"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="af"/></marker><pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" class="ln" stroke-width="1.2"/></pattern></defs><rect class="bg" x="0" y="0" width="900" height="380" rx="10"/><rect x="276.0" y="50" width="154.0" height="90" fill="url(#hach)" opacity=".55"/><line x1="276.0" y1="45.0" x2="276.0" y2="145.0" class="ln" stroke-width="2.5"/><text x="282.0" y="43.0" class="t2" text-anchor="start" >paroi</text><line x1="90.0" y1="95.0" x2="400.0" y2="95.0" class="grid" stroke-width="1.2"/><circle cx="120.0" cy="95.0" r="8" class="bf" /><circle cx="240.0" cy="95.0" r="8" class="bf" /><circle cx="360.0" cy="95.0" r="8" class="sf" stroke-width="2" stroke="currentColor" style="stroke:#898781"/><text x="120.0" y="125.0" class="t2" text-anchor="middle" >x − c_i</text><text x="240.0" y="125.0" class="t2" text-anchor="middle" >x</text><text x="360.0" y="125.0" class="t2" text-anchor="middle" >nœud solide</text><line x1="240.0" y1="69.0" x2="276.0" y2="69.0" class="ln" stroke-width="1" marker-end="url(#mln)"/><line x1="276.0" y1="69.0" x2="240.0" y2="69.0" class="ln" stroke-width="1" marker-end="url(#mln)"/><text x="258.0" y="63.0" class="tm" text-anchor="middle" >q</text><line x1="244.0" y1="107.0" x2="273.0" y2="107.0" class="o" stroke-width="2" marker-end="url(#mo)"/><line x1="273.0" y1="113.0" x2="244.0" y2="113.0" class="b" stroke-width="2" marker-end="url(#mb)"/><text x="36.0" y="100.0" class="tb" text-anchor="start" >q &lt; ½</text><text x="450.0" y="89.0" class="tm" text-anchor="start" >f_ī(x) = 2q f_i*(x) + (1 − 2q) f_i*(x − c_i) + 6w_i c_ī·u_w</text><text x="450.0" y="111.0" class="t2" text-anchor="start" >interpolation avant le rebond, entre x − c_i et x</text><rect x="324.0" y="200" width="106.0" height="90" fill="url(#hach)" opacity=".55"/><line x1="324.0" y1="195.0" x2="324.0" y2="295.0" class="ln" stroke-width="2.5"/><text x="330.0" y="193.0" class="t2" text-anchor="start" >paroi</text><line x1="90.0" y1="245.0" x2="400.0" y2="245.0" class="grid" stroke-width="1.2"/><circle cx="120.0" cy="245.0" r="8" class="bf" /><circle cx="240.0" cy="245.0" r="8" class="bf" /><circle cx="360.0" cy="245.0" r="8" class="sf" stroke-width="2" stroke="currentColor" style="stroke:#898781"/><text x="120.0" y="275.0" class="t2" text-anchor="middle" >x − c_i</text><text x="240.0" y="275.0" class="t2" text-anchor="middle" >x</text><text x="360.0" y="275.0" class="t2" text-anchor="middle" >nœud solide</text><line x1="240.0" y1="219.0" x2="324.0" y2="219.0" class="ln" stroke-width="1" marker-end="url(#mln)"/><line x1="324.0" y1="219.0" x2="240.0" y2="219.0" class="ln" stroke-width="1" marker-end="url(#mln)"/><text x="282.0" y="213.0" class="tm" text-anchor="middle" >q</text><line x1="244.0" y1="257.0" x2="321.0" y2="257.0" class="o" stroke-width="2" marker-end="url(#mo)"/><line x1="321.0" y1="263.0" x2="244.0" y2="263.0" class="b" stroke-width="2" marker-end="url(#mb)"/><text x="36.0" y="250.0" class="tb" text-anchor="start" >q ≥ ½</text><text x="450.0" y="239.0" class="tm" text-anchor="start" >f_ī(x) = [f_i*(x) + (2q − 1) f_ī*(x) + 6w_i c_ī·u_w] / 2q</text><text x="450.0" y="261.0" class="t2" text-anchor="start" >interpolation après le rebond, entre x et x + c_i</text><text x="450.0" y="330.0" class="t2" text-anchor="start" >u_w : vitesse de glissement de la loi de paroi,</text><text x="450.0" y="347.0" class="t2" text-anchor="start" >projetée dans le plan de la face touchée.</text><line x1="120.0" y1="340.0" x2="160.0" y2="340.0" class="o" stroke-width="2" marker-end="url(#mo)"/><text x="168.0" y="344.0" class="t2" text-anchor="start" >f_i* sortant (après collision)</text><line x1="120.0" y1="362.0" x2="160.0" y2="362.0" class="b" stroke-width="2" marker-end="url(#mb)"/><text x="168.0" y="366.0" class="t2" text-anchor="start" >f_ī reconstruit</text></svg>
