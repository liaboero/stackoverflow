text><text x="600.0" y="148.0" class="t2" text-anchor="start" ></text><text x="622.0" y="148.0" class="t2" text-anchor="start" >pente τ_p / (ν + ν_w)</text><text x="600.0" y="170.0" class="t2" text-anchor="start" >3.</text><text x="622.0" y="170.0" class="t2" text-anchor="start" >glissement du nœud :</text><text x="600.0" y="192.0" class="t2" text-anchor="start" ></text><text x="622.0" y="192.0" class="t2" text-anchor="start" >u_s = min(u_n, u_h) − pente · y_n,</text><text x="600.0" y="214.0" class="t2" text-anchor="start" ></text><text x="622.0" y="214.0" class="t2" text-anchor="start" >plancher u_h − pente · h</text><text x="600.0" y="236.0" class="t2" text-anchor="start" >4.</text><text x="622.0" y="236.0" class="t2" text-anchor="start" >relaxation : u_w += 0,1 (u_s − u_w)</text><text x="600.0" y="258.0" class="t2" text-anchor="start" >5.</text><text x="622.0" y="258.0" class="t2" text-anchor="start" >Bouzidi en paroi mobile u_w</text><text x="600.0" y="292.0" class="t2" text-anchor="start" >La vitesse extrapolée à la paroi ne</text><text x="600.0" y="309.0" class="t2" text-anchor="start" >dépend plus de la place du nœud.</text></svg>
