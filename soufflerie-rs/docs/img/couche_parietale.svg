<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Couche pariétale de la loi de paroi à h = 2 mailles"><title>Couche pariétale de la loi de paroi à h = 2 mailles</title><style>
