[workspace]
members = ["lbm", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = false

# Tests de validation : calcul optimisé même en mode test.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
